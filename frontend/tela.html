<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Calculadora</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section>
            <h1>Calculadora top das galáxias</h1>
            <h2>Selecione a operação e os números desejados, </h2>
            <h2>após apertar o botão, o resultado aparecerá abaixo:</h2>
            <section>
                <p id="resultado"></p>
            </section>
            <button id="btncalcular">CALCULAR</button>
        </section>


        <section>
            <label for="numeros">Digite o primeiro e segundo número:</label>
            <input type="number" id="num1" placeholder="Primeiro número">
            <input type="number" id="num2" placeholder="Segundo número">
        </section>


        <section>
            <label for="operacao">Agora, digite a operação desejada:</label>
            <input type="text" id="operacao" placeholder="operações: + | - | x | /">
        </section>

        <script src="script.js"></script>
    </body>
</html>
